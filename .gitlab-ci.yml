test:
  stage: test
  image:
    name: docker:latest
    entrypoint: [""]
  before_script:
    - mkdir -p ~/.docker/cli-plugins
    - wget -O ~/.docker/cli-plugins/docker-compose https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64
    - chmod +x ~/.docker/cli-plugins/docker-compose
    - docker compose version
  script:
    - echo "HELLO CI"
    - docker compose build
    - docker compose up -d
    - docker compose ps

deploy:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "===DEPLOY START==="