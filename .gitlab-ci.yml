stages:
  - deploy

deploy:
  stage: deploy
  only:
    - main

  image: docker:latest

  before_script:
    - apk add --no-cache docker-compose
  script:
    - echo "===TEST START==="
    - echo "$CAPTCHA_KEY" > captcha.json
    - echo "$SERVER_KEY" > server.key
    - echo "$SERVER_CRT" > server.crt
    - docker compose down
    - docker compose build
    - docker compose up -d
    - echo "===TEST END==="