stages:
  - test
  - deploy

test:
  stage: test
  # image: alpine
  # image: docker:latest
  image:
    name: docker:latest
    entrypoint: [""]
  before_script:
    - apk add --no-cache py3-pip
    - pip install docker-compose --break-system-packages
    - docker-compose --version
  script:
    - echo "HELLO CI"
    - echo "BRANCH=$CI_COMMIT_BRANCH"
    - echo "REF=$CI_COMMIT_REF_NAME"
    - echo "PIPELINE_SOURCE=$CI_PIPELINE_SOURCE"
    - docker-compose build
    - docker-compose up -d
    - docker-compose ps

deploy:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "===DEPLOY START==="