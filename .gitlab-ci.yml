stages:
  - test
  - deploy

test:
  stage: test
  image:
    name: docker:latest
    entrypoint: [""]
  before_script:
    - mkdir -p ~/.docker/cli-plugins
    - wget -O ~/.docker/cli-plugins/docker-compose https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64
    - chmod +x ~/.docker/cli-plugins/docker-compose
    - docker compose version
  script:
    - echo "HELLO CI"
    - echo "$CAPTCHA_KEY" > captcha.json
    - echo "$SERVER_KEY" > server.key
    - echo "$SERVER_CRT" > server.crt
    - docker compose build
    - docker compose up -d
    - docker compose ps

deploy:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache openssh-client
    - chmod 600 "$SSH_PRIVATE_KEY"
  script:
    - echo "===DEPLOY START==="
    - CAPTCHA_B64=$(echo -n "$CAPTCHA_KEY" | base64 -w0)
    - SERVER_KEY_B64=$(echo -n "$SERVER_KEY" | base64 -w0)
    - SERVER_CRT_B64=$(echo -n "$SERVER_CRT" | base64 -w0)
    - >
      ssh -i "$SSH_PRIVATE_KEY" -o StrictHostKeyChecking=no
      "$DEPLOY_USER@$DEPLOY_HOST"
      "cd ~/aquarium &&
      git pull &&
      echo '$CAPTCHA_B64' | base64 -d > captcha.json &&
      echo '$SERVER_KEY_B64' | base64 -d > server.key &&
      echo '$SERVER_CRT_B64' | base64 -d > server.crt &&
      docker compose down &&
      docker compose up -d --build &&
      docker compose ps"
    - echo "===DEPLOY DONE==="
    