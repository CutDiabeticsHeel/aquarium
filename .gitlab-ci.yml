stages:
  - test
  - deploy

test:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "HELLO CI"
    - echo "BRANCH=$CI_COMMIT_BRANCH"
    - echo "REF=$CI_COMMIT_REF_NAME"
    - echo "PIPELINE_SOURCE=$CI_PIPELINE_SOURCE"
    - docker compose build
    - docker compose up -d
    - docker compose ps

deploy:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "===DEPLOY START==="