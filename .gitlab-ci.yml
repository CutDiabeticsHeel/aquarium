stages:
  - test
  - deploy

test:
  stage: test
  image:
    name: docker:latest
    entrypoint: [""]
  before_script:
    - apk add --no-cache docker-cli-compose
  script:
    - echo "HELLO CI"
    - docker compose build
    - docker compose up -d
    - docker compose ps

deploy:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "===DEPLOY START==="