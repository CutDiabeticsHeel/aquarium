stages:
  - test
  - deploy

test:
  stage: test
  image:
    name: docker:latest
    entrypoint: [""]
  before_script:
    - mkdir -p ~/.docker/cli-plugins
    - wget -O ~/.docker/cli-plugins/docker-compose https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64
    - chmod +x ~/.docker/cli-plugins/docker-compose
    - docker compose version
  script:
    - echo "HELLO CI"
    - echo "$CAPTCHA_KEY" > captcha.json
    - echo "$SERVER_KEY" > server.key
    - echo "$SERVER_CRT" > server.crt
    - docker compose build
    - docker compose up -d
    - docker compose ps

deploy:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache openssh-client
    - chmod 600 "$SSH_PRIVATE_KEY"
    - echo "Длина файла ключа:"
    - wc -l "$SSH_PRIVATE_KEY"
    - echo "Первая и последняя строки:"
    - head -1 "$SSH_PRIVATE_KEY"
    - tail -1 "$SSH_PRIVATE_KEY"
    - echo "Проверка на CRLF:"
    - cat -A "$SSH_PRIVATE_KEY" | head -3
    - echo "Валидация ключа:"
    - ssh-keygen -y -f "$SSH_PRIVATE_KEY" || echo "!!! КЛЮЧ НЕВАЛИДЕН !!!"
  script:
    - echo "===DEPLOY START==="
    - >
      ssh -i "$SSH_PRIVATE_KEY" -o StrictHostKeyChecking=no
      "$DEPLOY_USER@$DEPLOY_HOST"
      "cd ~/aquarium &&
      git pull &&
      echo \"$CAPTCHA_KEY\" > captcha.json &&
      echo \"$SERVER_KEY\" > server.key &&
      echo \"$SERVER_CRT\" > server.crt &&
      docker compose down &&
      docker compose up -d --build &&
      docker compose ps"
    - echo "===DEPLOY DONE==="